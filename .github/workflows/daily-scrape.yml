name: Daily scrape
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: scrape
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: node scripts/scrape.mjs
      - name: Commit data.json
        run: |
          git config user.name "scrape-bot"
          git config user.email "scrape-bot@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then git commit -m "Daily data update" && git push; fi
