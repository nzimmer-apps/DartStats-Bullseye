<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Darts Lookup</title>
<style>
:root{--bg:#f5f7fa;--tx:#202830;--ok:#1a7f4b;--wn:#963400}
@media(prefers-color-scheme:dark){:root{--bg:#0f1720;--tx:#e6edf3;--ok:#4cc38a;--wn:#e8a36b}}
:root{--card:color-mix(in srgb,var(--bg),var(--tx) 5%);--hd:color-mix(in srgb,var(--bg),var(--tx) 13%);--bd:color-mix(in srgb,var(--bg),var(--tx) 24%);--mu:color-mix(in srgb,var(--tx),var(--bg) 40%);--ac:color-mix(in srgb,var(--tx),#4a90d9 45%)}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,Segoe UI,Arial;background:var(--bg);color:var(--tx)}
main{max-width:900px;margin:0 auto;padding:16px}a{color:var(--ac)}
.top{display:flex;justify-content:space-between;align-items:center}h1{font-size:1.4rem;color:var(--ac);margin:8px 0 12px}
form{display:flex;gap:8px}input[type=text],input:not([type]){flex:1;min-width:0;padding:12px;font-size:1rem;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
button{padding:12px 16px;border:0;border-radius:8px;background:var(--ac);color:var(--bg);font-weight:600;font-size:1rem}
.mu{color:var(--mu);font-size:.9rem}.wn{color:var(--wn)}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:6px 12px;border-radius:99px;font-weight:400;font-size:.9rem}.chip.on{background:var(--ac);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:12px 0}
.card h2{margin:0 0 2px;font-size:1.1rem;color:var(--ac)}.stats{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.stat{background:var(--hd);border-radius:8px;padding:8px 12px;min-width:90px}.stat b{display:block;font-size:1.2rem}.stat span{font-size:.75rem;color:var(--mu)}
.badge{font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}.badge.in{color:var(--ok);border-color:var(--ok)}
details{margin-top:8px}summary{cursor:pointer;color:var(--ac);font-weight:600}
.tw{overflow-x:auto}table{border-collapse:collapse;margin:6px 0;font-size:.85rem}td,th{border:1px solid var(--bd);padding:5px 8px;text-align:left;white-space:nowrap}th{background:var(--hd)}
.pdfbox{overflow-x:auto;border:1px solid var(--bd);border-radius:8px;margin:8px 0;background:#fff;color:#202830;padding:4px}.pdfbox canvas{display:block;margin:0 0 6px}.pdfbox p{margin:8px;color:#202830}
#out th{cursor:pointer}
.potw{border-color:var(--ok)}.potw .pk{color:var(--ok);font-size:.8rem;font-weight:600}
tr.hl td{background:var(--hd);font-weight:700}h3{font-size:.95rem;margin:14px 0 2px}
#pal{display:none}#pal.open{display:block}#pal label{margin-right:12px;font-size:.9rem}#pal input[type=color]{width:44px;height:32px;padding:0;border:1px solid var(--bd);vertical-align:middle;background:none}
</style></head><body><main>
<div class="top"><h1>Darts Lookup</h1><button class="chip" id="pb" type="button" aria-label="Colors">🎨 Colors</button></div>
<div class="card" id="pal"><div class="chips" id="pre"></div>
<label>Background <input type="color" id="cb"></label><label>Text <input type="color" id="ct"></label>
<button class="chip" id="rs" type="button">Reset</button></div>
<form id="f"><input id="q" placeholder="Player name (e.g. Nick Zimmer)" autocomplete="off" autocapitalize="words" required minlength="2"><button>Search</button></form>
<p class="mu"><a href="#" id="bl">Browse all leagues</a> · <a href="#" id="lbl">Leaderboard</a></p><p class="mu" id="st"></p><div class="chips" id="chips"></div><div id="out"></div>
</main><script>
const DATA_URL='https://raw.githubusercontent.com/nzimmer-apps/DartStats-Bullseye/main/data.json',TTL=864e5;
const TEAMK=['Team','TeamName','Against','Opponent','Home','Away'],PRE={Light:['#f5f7fa','#202830'],Dark:['#0f1720','#e6edf3'],Midnight:['#000000','#9fd3ff'],Sepia:['#f4ecd8','#4a3b28'],'High contrast':['#000000','#ffff00']};
const $=id=>document.getElementById(id),cl=s=>(s||'').replace(/\s+/g,' ').trim();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
let DB=null,data=null,cur=null,view=null,stack=[];
const nrm=s=>cl(s).toLowerCase().replace(/[^a-z0-9]/g,''),same=(a,b)=>{a=nrm(a);b=nrm(b);return!!a&&!!b&&(a===b||(Math.min(a.length,b.length)>=8&&(a.startsWith(b)||b.startsWith(a))))};
const col=(hd,n)=>hd.find(h=>h.toLowerCase()===n),schedCols=hd=>{const h=col(hd,'home'),a=col(hd,'away');return h&&a?{h,a,w:col(hd,'week'),d:col(hd,'date')}:null};
const parseD=s=>{const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s||'');return m?new Date(+m[3],m[1]-1,+m[2]):null};
function normSched(t){const c=schedCols(t.headers);if(!c)return;let wk='',dt='';
  t.rows=t.rows.filter(r=>{if(c.w){if(r[c.w])wk=r[c.w];else r[c.w]=wk}if(c.d){if(r[c.d])dt=r[c.d];else r[c.d]=dt}return r[c.h]||r[c.a]})}
const prep=db=>{db.pages.forEach(p=>p.tabs.forEach(normSched));return db};
/* colors */
function applyColors(){const s=document.documentElement.style,b=ls.get('dl:bg'),t=ls.get('dl:tx');
  b?s.setProperty('--bg',b):s.removeProperty('--bg');t?s.setProperty('--tx',t):s.removeProperty('--tx');
  const g=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  if(/^#[0-9a-f]{6}$/i.test(g('--bg')))$('cb').value=g('--bg');if(/^#[0-9a-f]{6}$/i.test(g('--tx')))$('ct').value=g('--tx')}
$('pre').innerHTML=Object.keys(PRE).map(n=>`<button type="button" class="chip" data-pre="${esc(n)}">${esc(n)}</button>`).join('');
$('pb').onclick=()=>$('pal').classList.toggle('open');
$('pre').onclick=e=>{const p=PRE[e.target.dataset.pre];if(p){ls.set('dl:bg',p[0]);ls.set('dl:tx',p[1]);applyColors()}};
$('cb').oninput=e=>{ls.set('dl:bg',e.target.value);applyColors()};$('ct').oninput=e=>{ls.set('dl:tx',e.target.value);applyColors()};
$('rs').onclick=()=>{ls.del('dl:bg');ls.del('dl:tx');applyColors()};applyColors();
/* data */
async function loadDB(force){
  if(DB&&!force)return DB;
  const ts=+ls.get('dl:ts')||0,c=ls.get('dl:db');
  if(!force&&c&&Date.now()-ts<TTL){DB=prep(JSON.parse(c));return DB}
  try{const r=await fetch(DATA_URL+'?t='+Math.floor(Date.now()/36e5));if(!r.ok)throw new Error('HTTP '+r.status);
    DB=prep(await r.json());ls.set('dl:db',JSON.stringify(DB));ls.set('dl:ts',String(Date.now()));return DB}
  catch(e){if(c){DB=prep(JSON.parse(c));DB.offline=true;return DB}throw new Error('Could not load stats data ('+e.message+')')}}
function analyze(url,p,toks,players){
  const names={};
  p.tabs.forEach(t=>t.rows.forEach(r=>['Player','Captain'].forEach(k=>{const n=r[k];
    if(n&&toks.every(x=>n.toLowerCase().includes(x)))(names[cl(n).toLowerCase().replace(/\b\w/g,c=>c.toUpperCase())]??=[]).push([t,r])})));
  for(const[name,hits]of Object.entries(names)){
    const teams=[...new Set(hits.flatMap(([,r])=>['Team','TeamName'].filter(k=>k in r).map(k=>r[k])))].sort();
    const playerTables=hits.map(([t,r])=>({heading:t.heading,headers:t.headers,rows:[r],scope:/week\s+\d+/i.test(t.heading)?'weekly':'overall'}));
    const teamTables=[];
    p.tabs.forEach(t=>{if(t.headers.includes('Player')||t.headers.includes('Captain'))return;
      const rows=t.rows.filter(r=>teams.includes(r.Team));
      if(rows.length)teamTables.push({heading:t.heading,headers:t.headers,rows})});
    (players[name]??=[]).push({title:p.title||url,url,teams,playerTables,teamTables})}}
async function search(q){
  const toks=q.toLowerCase().split(/\s+/),players={},db=await loadDB();
  db.pages.forEach(p=>analyze(p.url,p,toks,players));
  return{scanned:db.scanned,players,errors:db.errors||[],generated:db.generated,offline:db.offline}}
/* rendering */
function cell(k,v,u){if(!v)return'';
  if(TEAMK.includes(k))return`<a href="#" data-u="${esc(u)}" data-t="${esc(v)}">${esc(v)}</a>`;
  if(k==='Player'||k==='Captain')return`<a href="#" data-p="${esc(v)}">${esc(v)}</a>`;return esc(v)}
const tbl=(h,rows,u,hl)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${rows.map(r=>`<tr${hl&&hl(r)?' class="hl"':''}>${h.map(k=>`<td>${cell(k,r[k],u)}</td>`).join('')}</tr>`).join('')}</table></div>`;
const stat=(v,l)=>v==null?'':`<div class="stat"><b>${esc(v)}</b><span>${esc(l)}</span></div>`;
const tlink=(u,t)=>`<a href="#" data-u="${esc(u)}" data-t="${esc(t)}">${esc(t)}</a>`;
const pdfOf=u=>{const p=DB.pages.find(x=>x.url===u)?.pdfs||[];return p.find(x=>x.schedule)||p[0]};
const pdfLink=u=>{const p=pdfOf(u);return p?`<a href="#" data-pdf="${esc(p.url)}">View schedule</a> (<a href="${esc(p.url)}" target="_blank" rel="noopener">open PDF</a>)`:''};
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',PDFW='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const loadScript=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('Could not load the PDF viewer'));document.head.appendChild(s)});
async function pdfBytes(url){
  const H=window.Capacitor?.Plugins?.CapacitorHttp;
  if(H){const r=await H.get({url,responseType:'blob'});if(r.status&&r.status>=400)throw new Error('HTTP '+r.status);
    const b=atob(r.data),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return new Uint8Array(await r.arrayBuffer())}
async function showPdf(url,box){
  box.innerHTML='<p>Loading schedule…</p>';
  try{if(!window.pdfjsLib){await loadScript(PDFJS);pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW}
    const pdf=await pdfjsLib.getDocument({data:await pdfBytes(url)}).promise;box.innerHTML='';
    const cssW=Math.max(box.clientWidth*1.6,520),dpr=window.devicePixelRatio||1;
    for(let n=1;n<=pdf.numPages;n++){const pg=await pdf.getPage(n),v0=pg.getViewport({scale:1}),v=pg.getViewport({scale:cssW*dpr/v0.width});
      const c=document.createElement('canvas');c.width=v.width;c.height=v.height;c.style.width=cssW+'px';c.style.height=(v.height/dpr)+'px';
      box.appendChild(c);await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise}
  }catch(e){box.innerHTML=`<p>Couldn’t show the schedule here (${esc(e.message)}). <a href="${esc(url)}" target="_blank" rel="noopener">Open the PDF</a></p>`}}
function togglePdf(a){const card=a.closest('.card');let box=card.querySelector('.pdfbox');
  if(box){box.remove();a.textContent='View schedule';return}
  box=document.createElement('div');box.className='pdfbox';card.querySelector('.mu').after(box);a.textContent='Hide schedule';showPdf(a.dataset.pdf,box)}
function nextMatch(L){const p=DB.pages.find(x=>x.url===L.url),t=p?.tabs.find(t=>schedCols(t.headers));if(!t)return'';
  const c=schedCols(t.headers),td=new Date();td.setHours(0,0,0,0);
  for(const r of t.rows){const d=parseD(r[c.d]);if(!d||d<td)continue;const hm=L.teams.find(x=>same(r[c.h],x)),aw=L.teams.find(x=>same(r[c.a],x));
    if(hm||aw)return`<div>Next match: <b>${esc(r[c.d])}</b> vs ${esc(hm?r[c.a]:r[c.h])} (${hm?'home':'away'})</div>`}return''}
function combinedCard(Ls){
  const A={MPR:{s:0,g:0},PPD:{s:0,g:0}},rows=Ls.map(L=>{const o={t:L.title,MPR:{s:0,g:0},PPD:{s:0,g:0}};
    L.playerTables.filter(t=>t.scope==='overall').forEach(t=>{const r=t.rows[0];
      for(const k of['MPR','PPD'])if(k in r&&'Gam' in r){const v=parseFloat(r[k]),g=parseInt(r.Gam,10);
        if(isFinite(v)&&g>0){o[k].s+=v*g;o[k].g+=g;A[k].s+=v*g;A[k].g+=g}}});return o});
  const f=(a,d)=>a.g?(a.s/a.g).toFixed(d):'–';
  if(!A.MPR.g&&!A.PPD.g)return'';
  return`<div class="card"><h2>All leagues combined</h2><div class="stats">`+(A.MPR.g?stat(f(A.MPR,2),`Cricket MPR · ${A.MPR.g} games`):'')+(A.PPD.g?stat(f(A.PPD,2),`X01 PPD · ${A.PPD.g} games`):'')+`</div>
  <div class="tw"><table><tr><th>League</th><th>MPR</th><th>Games</th><th>PPD</th><th>Games</th></tr>${rows.map(o=>`<tr><td>${esc(o.t)}</td><td>${f(o.MPR,2)}</td><td>${o.MPR.g||''}</td><td>${f(o.PPD,2)}</td><td>${o.PPD.g||''}</td></tr>`).join('')}</table></div>
  <p class="mu">Weighted by games played in each league. The leagues don’t publish darts thrown, so this is an approximation.</p></div>`}
const potwCache=new WeakMap();
const tcase=s=>s.replace(/\w\S*/g,w=>w[0].toUpperCase()+w.slice(1).toLowerCase());
function potw(p){if(!p)return null;if(potwCache.has(p))return potwCache.get(p);let res=null;
  const ws={};p.tabs.forEach(t=>{const m=/week\s+(\d+)/i.exec(t.heading||'');if(m&&!/improved/i.test(t.heading))(ws[+m[1]]??=[]).push(t)});
  const wk=Math.max(...Object.keys(ws).map(Number));
  if(isFinite(wk)){const pl={};
    ws[wk].forEach(t=>{const x01=t.headers.includes('Wins'),wc=x01?'Wins':t.headers.includes('Win')?'Win':null,tc=t.headers.includes('Team')?'Team':'TeamName';
      if(!wc||!t.headers.includes('Player'))return;
      t.rows.forEach(r=>{const n=cl(r.Player);if(!n)return;const k=n.toLowerCase(),o=pl[k]??={k,name:tcase(n),team:r[tc]||'',cw:0,xw:0,out:0};
        const w=parseInt(r[wc],10)||0;if(x01)o.xw+=w;else o.cw+=w;
        if(x01&&'HstOut'in r)o.out=Math.max(o.out,parseFloat(r.HstOut)||0)})});
    const L=Object.values(pl).map(o=>({...o,wins:o.cw+o.xw})).sort((a,b)=>b.wins-a.wins||b.out-a.out),top=L[0];
    if(top&&top.wins)res={week:wk,win:L.filter(o=>o.wins===top.wins&&o.out===top.out),list:L}}
  potwCache.set(p,res);return res}
const isPotw=(url,name)=>{const w=potw(DB.pages.find(x=>x.url===url));return w&&w.win.some(o=>o.k===cl(name).toLowerCase())?w:null};
function potwLine(p){const w=potw(p);if(!w)return'';const o=w.win[0];
  return w.win.length>1?`Week ${w.week} · Co-winners (${w.win.length} tied on ${o.wins} wins)`:`Week ${w.week} · ${esc(o.name)} · ${o.wins} wins${o.out?', '+o.out+' out':''}`}
function potwCard(p){const w=potw(p);if(!w)return'';const o=w.win[0],co=w.win.length>1;
  let h=`<div class="card potw"><div class="pk">★ Player of the week · Week ${w.week}</div>`;
  h+=w.win.map(x=>`<h2 style="margin:6px 0 0"><a href="#" data-p="${esc(x.name)}">${esc(x.name)}</a></h2><div class="mu">${esc(x.team)}</div>`).join('');
  h+=`<div class="stats">`+stat(`${o.wins} wins`,co?'each':`${o.cw} Cricket · ${o.xw} X01`)+stat(o.out||'–','High out'+(co&&!o.out?' (none recorded)':''))+`</div>`;
  const rest=w.list.filter(x=>!w.win.includes(x)).slice(0,3);
  if(rest.length)h+=tbl(['Player','Team','Wins','High out'],rest.map(x=>({Player:x.name,Team:x.team,Wins:String(x.wins),'High out':x.out?String(x.out):''})),p.url,null);
  return h+`<p class="mu">Wins are Cricket plus X01 for the week. Highest out breaks ties.</p></div>`}
function league(L,name){
  const ov=L.playerTables.filter(t=>t.scope==='overall').map(t=>t.rows[0]),f=k=>ov.find(r=>k in r)?.[k];
  const st=L.teamTables.find(t=>/standing/i.test(t.heading))?.rows[0],lm=L.teamTables.find(t=>/last match/i.test(t.heading))?.rows[0];
  const pw=name&&isPotw(L.url,name);
  let h=`<div class="card"><h2>${esc(L.title)}</h2>${pw?`<div><span class="badge in">★ Player of the week · Week ${pw.week}</span></div>`:''}<div class="mu">${L.teams.map(t=>tlink(L.url,t)).join(', ')} · <a href="${esc(L.url)}" target="_blank" rel="noopener">league page</a> · <a href="#" data-l="${esc(L.url)}">Full league stats</a>${pdfOf(L.url)?' · '+pdfLink(L.url):''}</div><div class="stats">`
   +stat(f('MPR'),'Cricket MPR')+stat(f('PPD'),'X01 PPD')+(st?stat(`${st.Wins}-${st.Losses}`,`Team (${st['Win %']}%)`):'')+'</div>';
  if(lm)h+=`<div>Last match: <b>${esc(lm.Date)}</b> vs ${esc(lm.Against)} · ${esc(lm.Wins)}-${esc(lm.Losses)}</div>`;
  h+=nextMatch(L);
  h+='<p class="mu">Tap a team to see its full roster, standings and schedule.</p><details><summary>All tables</summary>';
  L.teamTables.forEach(t=>h+=`<h3>${esc(t.heading)}</h3>`+tbl(t.headers,t.rows,L.url));
  L.playerTables.forEach(t=>h+=`<h3>${esc(t.heading)} <span class="mu">(${t.scope==='weekly'?'published weekly, week not dated':'season to date'})</span></h3>`+tbl(t.headers,t.rows,L.url));
  return h+'</details></div>'}
function teamView(u,T){
  const p=DB.pages.find(x=>x.url===u),eq=v=>same(v,T),isT=r=>eq(r.Team??r.TeamName??'');
  if(!p)return'<p class="wn">League data not found.</p>';
  const secs=[];
  p.tabs.forEach(t=>{const pl=t.headers.includes('Player')||t.headers.includes('Captain');
    const c=schedCols(t.headers);let rows,hd=t.headers;
    if(c){const td=new Date();td.setHours(0,0,0,0);let nx=false;
      rows=t.rows.filter(r=>eq(r[c.h])||eq(r[c.a])).map(r=>{const d=parseD(r[c.d]),o={Week:r[c.w]||'',Date:r[c.d]||'',Opponent:eq(r[c.h])?r[c.a]:r[c.h],'H/A':eq(r[c.h])?'Home':'Away'};
        if(!nx&&d&&d>=td){o._next=true;nx=true}return o});hd=['Week','Date','Opponent','H/A']}
    else rows=pl?t.rows.filter(isT):/standing/i.test(t.heading)?t.rows:t.rows.filter(r=>Object.values(r).some(eq));
    if(rows.length)secs.push({t,rows,pl,hd,sc:!!c||/schedul/i.test(t.heading)})});
  secs.sort((a,b)=>(a.pl-b.pl)||(b.sc-a.sc));
  let h=`<button class="chip" id="back" type="button">← Back</button><div class="card"><h2>${esc(T)}</h2><div class="mu">${esc(p.title)} · <a href="${esc(u)}" target="_blank" rel="noopener">league page</a> · <a href="#" data-l="${esc(u)}">Full league stats</a>${pdfOf(u)?' · '+pdfLink(u):''}</div>`;
  const full=p.tabs.find(t=>schedCols(t.headers));
  if(!secs.some(s=>s.sc))h+=`<p class="mu">${full?'No schedule rows matched this team’s name (the schedule may spell it differently). See the full schedule below.':pdfOf(u)?'This league publishes its schedule as a PDF: '+pdfLink(u)+'.':'No schedule table was found on this league’s page.'}</p>`;
  secs.forEach(s=>h+=`<h3>${esc(s.t.heading||'Table')}${s.pl?' <span class="mu">(team roster)</span>':''}</h3>`+tbl(s.hd,s.rows,u,/standing/i.test(s.t.heading)?isT:r=>r._next));
  if(full)h+=`<details><summary>Full league schedule</summary>${tbl(full.headers,full.rows,u)}</details>`;
  h+=`<details><summary>Tables on this league’s page</summary><p class="mu">${p.tabs.map(t=>esc(t.heading||'(untitled)')).join('<br>')}</p></details>`;
  return h+'</div>'}
function status(){if(!data)return;const g=new Date(data.generated).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  $('st').innerHTML=`Scanned ${data.scanned} leagues · stats updated ${g}${data.offline?' (offline copy)':''} · <a href="#" id="rf">Refresh</a>`}
const lbCache=new WeakMap();
function lbData(){if(lbCache.has(DB))return lbCache.get(DB);
  const out={MPR:{},PPD:{}},seen=new Set();
  DB.pages.forEach(p=>p.tabs.forEach(t=>{
    if(/week\s+\d+|improved/i.test(t.heading||'')||!t.headers.includes('Player')||!t.headers.includes('Gam'))return;
    ['MPR','PPD'].forEach(k=>{if(!t.headers.includes(k))return;
      t.rows.forEach(r=>{const n=cl(r.Player).toLowerCase(),v=parseFloat(r[k]),g=parseFloat(r.Gam);
        if(!n||!isFinite(v)||!(g>0))return;const key=p.url+'|'+k+'|'+n;if(seen.has(key))return;seen.add(key);
        const a=out[k][n]??={name:tcase(cl(r.Player)),s:0,g:0,l:new Set()};a.s+=v*g;a.g+=g;a.l.add(p.url)})})}));
  const res={};for(const k of['MPR','PPD'])res[k]=Object.values(out[k]).map(a=>({name:a.name,v:a.s/a.g,g:a.g,l:a.l.size}));
  lbCache.set(DB,res);return res}
function lbRows(){const all=lbData()[view.st].filter(x=>x.g>=view.min).sort((a,b)=>b.v-a.v||b.g-a.g);
  all.forEach((x,i)=>x.rank=i+1);const f=view.f.toLowerCase();return{all:all.length,rows:f?all.filter(x=>x.name.toLowerCase().includes(f)):all}}
function leaderboardView(){
  return`<button class="chip" id="back" type="button">← Back</button><div class="card"><h2>Leaderboard</h2><p class="mu">Every player across all leagues. Averages are weighted by games played, and players in more than one league are combined.</p>
  <div class="chips">${[['MPR','Cricket MPR'],['PPD','X01 PPD']].map(([k,l])=>`<button type="button" class="chip ${view.st===k?'on':''}" data-lb="st:${k}">${l}</button>`).join('')}</div>
  <div class="chips"><span class="mu" style="align-self:center">Min games</span>${[10,20,30,50].map(n=>`<button type="button" class="chip ${view.min===n?'on':''}" data-lb="min:${n}">${n}</button>`).join('')}</div>
  <input id="lbf" placeholder="Find a player" value="${esc(view.f)}" autocomplete="off" style="width:100%;margin:6px 0"><div id="lbt"></div>
  <p class="mu">Raw averages: handicapped leagues are not adjusted, so compare with care.</p></div>`}
function drawLb(){const{all,rows}=lbRows(),lab=view.st==='MPR'?'MPR':'PPD',shown=rows.slice(0,view.n);
  $('lbt').innerHTML=`<p class="mu">${view.f?rows.length+' matching · ':''}${all} players with ${view.min}+ games</p>`
    +(shown.length?tbl(['#','Player',lab,'Games','Leagues'],shown.map(x=>({'#':String(x.rank),Player:x.name,[lab]:x.v.toFixed(2),Games:String(x.g),Leagues:String(x.l)})),'',null):'<p class="mu">No players match.</p>')
    +(rows.length>shown.length?`<p><button type="button" class="chip" data-lb="more">Show more</button></p>`:'')}
function leaguesView(){const ps=[...DB.pages].sort((a,b)=>(a.title||a.url).localeCompare(b.title||b.url,undefined,{numeric:true}));
  return`<button class="chip" id="back" type="button">← Back</button><div class="card"><h2>All leagues</h2><p class="mu">Tap a league for its full stats.</p>${ps.map(p=>`<div style="padding:4px 0"><a href="#" data-l="${esc(p.url)}">${esc(p.title||p.url)}</a><div class="mu">${potw(p)?'★ '+potwLine(p):'No weekly results published'}</div></div>`).join('')}</div>`}
function leagueView(u,i){
  const p=DB.pages.find(x=>x.url===u);if(!p)return'<p class="wn">League data not found.</p>';
  const secs=p.tabs.filter(t=>t.rows.length),k=Math.min(i||0,secs.length-1),t=secs[k];
  let h=`<button class="chip" id="back" type="button">← Back</button><div class="card"><h2>${esc(p.title||'League')}</h2><div class="mu"><a href="${esc(u)}" target="_blank" rel="noopener">league page</a>${pdfOf(u)?' · '+pdfLink(u):''}</div>`;
  if(!t)return h+'<p class="mu">No tables found for this league.</p></div>';
  h+=potwCard(p);
  h+=`<div class="chips">${secs.map((s,j)=>`<button type="button" class="chip ${j===k?'on':''}" data-sec="${j}">${esc((s.heading||'Table '+(j+1)).replace(/:$/,''))}</button>`).join('')}</div>`;
  h+=`<input id="lf" placeholder="Filter this table (name, team…)" autocomplete="off" style="width:100%;margin:6px 0"><p class="mu" id="rc">${t.rows.length} rows · tap a column header to sort</p>`+tbl(t.headers,t.rows,u,null)+'</div>';return h}
function render(){
  window.scrollTo(0,0);
  if(view?.lb){$('chips').innerHTML='';$('out').innerHTML=leaderboardView();drawLb();return status()}
  if(view?.ls){$('chips').innerHTML='';$('out').innerHTML=leaguesView();return status()}
  if(view?.l){$('chips').innerHTML='';$('out').innerHTML=leagueView(view.l,view.i);return status()}
  if(view){$('chips').innerHTML='';$('out').innerHTML=teamView(view.u,view.t);return status()}
  if(!data){$('chips').innerHTML='';$('out').innerHTML='';return}
  const names=Object.keys(data.players);
  $('chips').innerHTML=names.length>1?names.map(n=>`<button type="button" class="chip ${n===cur?'on':''}" data-n="${esc(n)}">${esc(n)} (${data.players[n].length})</button>`).join(''):'';
  $('out').innerHTML=cur?(data.players[cur].length>1?combinedCard(data.players[cur]):'')+data.players[cur].map(L=>league(L,cur)).join(''):'<p>No matching players found.</p>';status()}
$('chips').onclick=e=>{const n=e.target.dataset?.n;if(n){cur=n;render()}};
$('out').onclick=e=>{const a=e.target.closest('a[data-t],a[data-p],a[data-pdf],a[data-l],button[data-sec],button[data-lb],#back');if(!a)return;e.preventDefault();
  if(a.dataset.pdf)return togglePdf(a);
  if(a.id==='back'){view=stack.pop()||null;return render()}
  if(a.dataset.lb){const[k,v]=a.dataset.lb.split(':');
    if(k==='more'){view.n+=50;return drawLb()}
    if(k==='st')view.st=v;else view.min=+v;view.n=50;return render()}
  if(a.dataset.sec!==undefined){view={...view,i:+a.dataset.sec};return render()}
  if(a.dataset.l){stack.push(view);view={l:a.dataset.l,i:0};return render()}
  if(a.dataset.t){stack.push(view);view={u:a.dataset.u,t:a.dataset.t};return render()}
  $('q').value=a.dataset.p;$('f').requestSubmit()};
$('st').onclick=async e=>{if(e.target.id!=='rf')return;e.preventDefault();$('st').textContent='Refreshing…';
  try{await loadDB(true);const q=$('q').value.trim();if(q){data=await search(q);render()}else{data={...data,generated:DB.generated,offline:false};status()}}catch(err){$('st').innerHTML=`<span class="wn">${esc(err.message)}</span>`}};
$('f').onsubmit=async e=>{e.preventDefault();const q=$('q').value.trim();view=null;stack=[];
  $('st').textContent='Loading…';$('out').innerHTML='';$('chips').innerHTML='';
  try{data=await search(q);cur=Object.keys(data.players).sort((a,b)=>data.players[b].length-data.players[a].length)[0]||null;render()}
  catch(err){$('st').innerHTML=`<span class="wn">${esc(err.message)}</span>`}};
$('lbl').onclick=async e=>{e.preventDefault();$('st').textContent='Loading…';
  try{await loadDB();stack=[];view={lb:1,st:'MPR',min:20,f:'',n:50};$('st').textContent='';render()}catch(err){$('st').innerHTML=`<span class="wn">${esc(err.message)}</span>`}};
document.addEventListener('input',e=>{if(e.target.id!=='lbf')return;view.f=e.target.value;view.n=50;drawLb()});
$('bl').onclick=async e=>{e.preventDefault();$('st').textContent='Loading…';
  try{await loadDB();stack=[];view={ls:1};$('st').textContent='';render()}catch(err){$('st').innerHTML=`<span class="wn">${esc(err.message)}</span>`}};
document.addEventListener('input',e=>{if(e.target.id!=='lf')return;const q=e.target.value.toLowerCase();let n=0;
  document.querySelectorAll('#out table tr').forEach((tr,j)=>{if(!j)return;const m=!q||tr.textContent.toLowerCase().includes(q);tr.style.display=m?'':'none';if(m)n++});
  $('rc').textContent=n+' rows · tap a column header to sort'});
document.addEventListener('click',e=>{const th=e.target.closest('#out th');if(!th)return;
  const tb=th.closest('table'),i=[...th.parentNode.children].indexOf(th),rows=[...tb.querySelectorAll('tr')].slice(1),dir=th.dataset.d==='a'?-1:1;th.dataset.d=dir===1?'a':'d';
  const v=r=>(r.children[i]?.textContent||'').trim(),num=rows.every(r=>v(r)===''||!isNaN(parseFloat(v(r))));
  rows.sort((a,b)=>num?(parseFloat(v(a))||0)-(parseFloat(v(b))||0):v(a).localeCompare(v(b)));if(dir<0)rows.reverse();
  if(rows.length)rows.forEach(r=>r.parentNode.appendChild(r))});
</script></body></html>
